name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# A newer push makes an in-flight run obsolete — cancel it rather than paying
# for both. Deploys in progress are left alone so a release can't be truncated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # `npm run build` type-checks again; call Vite directly since the step above
      # already covered it.
      - name: Build
        run: npx vite build

      - name: Upload Pages artifact
        # Only the deploy needs this, so skip the upload on pull requests.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
