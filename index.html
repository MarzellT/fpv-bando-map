<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FPV-Spots in Deutschland: Satellitenkarte, recherchierte Ortsdossiers, Flugvideos und Pilotennetz in 2D und 3D."
    />
    <title>FPV Bando Map — Germany</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <h1>FPV&nbsp;Bando&nbsp;Map <span>· Germany</span></h1>
          <p class="sub" id="count"></p>
        </div>
        <nav class="site-links" aria-label="Hauptnavigation">
          <a href="./" aria-current="page">Karte</a>
          <a href="./atlas/">Atlas & Videos</a>
          <a href="./netzwerk/">Pilotennetz</a>
          <a href="./tagesauswahl/">Tagesauswahl</a>
        </nav>
        <div id="filters" class="filters" role="group" aria-label="Kategorien filtern"></div>
        <div id="basetoggle" class="basetoggle" role="group" aria-label="Base layer">
          <button data-base="map" class="active" aria-pressed="true" disabled>Karte</button>
          <button data-base="sat" aria-pressed="false" disabled>Satellit</button>
        </div>
      </header>
      <div id="main">
        <div id="map" aria-label="Map of FPV bando spots in Germany"></div>
        <aside id="sidebar" aria-label="Spots und Belege">
          <div class="search-controls">
            <label for="spot-search" class="mini-label">SPOT, ORT ODER PILOT</label>
            <input id="spot-search" type="search" placeholder="Deutschlandweit suchen …" />
            <label class="research-filter"
              ><input id="research-only" type="checkbox" /> Nur mit Atlas-Belegen</label
            >
            <div id="origin-control"></div>
          </div>
          <div id="sidebar-content"></div>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
